<nav class="page__nav main-nav">
    <ul>
      <li class="nomarker"><p class="page__logo"><a href="{{ site.Home.RelPermalink }}" class="page__logo-inner">{{ site.Title }}</a></p></li>
    {{ $currentPage := . }}
    {{ range site.Menus.main }}
    <li class="main-nav__item"><a class="nav-main-item{{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }} active{{ end }}" href="{{ .URL }}">{{ .Name }}</a></li>
    {{ end }}
    </ul>
</nav>
