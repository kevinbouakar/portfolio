<div class="np">
  <div class="np-row">
    <div><p class="np-label">Artist</p><a class="np-artist"></a></div>
    <div><p class="np-label">Track</p><a class="np-track"></a></div>
  </div>
  <p class="np-footer">loading…</p>
</div>
<script>
(async function () {
  const box = document.currentScript.previousElementSibling;
  const $ = (s) => box.querySelector(s);
  const user = "{{ site.Params.lastfmUser }}";
  const api = "https://ws.audioscrobbler.com/2.0/?format=json&api_key={{ site.Params.lastfmKey }}";
  const q = encodeURIComponent;
  try {
    const recent = await (await fetch(api + "&method=user.getrecenttracks&limit=1&user=" + q(user))).json();
    const t = recent.recenttracks.track[0];
    const artist = t.artist["#text"];
    const album = t.album["#text"];

    $(".np-artist").textContent = artist;
    $(".np-artist").href = "https://www.last.fm/music/" + q(artist);
    $(".np-track").textContent = t.name;
    $(".np-track").href = t.url;

    let plays = "";
    try {
      const info = await (await fetch(api + "&method=track.getInfo&username=" + q(user)
        + "&artist=" + q(artist) + "&track=" + q(t.name))).json();
      if (info.track && info.track.userplaycount) plays = "Playcount: " + info.track.userplaycount;
    } catch (e) {}

    $(".np-footer").textContent = [plays, album].filter(Boolean).join(" • ");
  } catch (e) {
    $(".np-footer").textContent = "couldn't reach last.fm";
  }
})();
</script>
