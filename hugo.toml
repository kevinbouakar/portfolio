baseURL = 'https://kevinbouakar.github.io/portfolio/'
locale = 'en-us'
title = "Kevin's Endeavour"
theme = 'risotto'
capitalizeListTitles = false
enableGitInfo = true

[frontmatter]
  lastmod = ['lastmod', ':git', 'date']

[params.theme]
  palette = "base16-light"

[params.about]
  title = "Kevin Bou Akar"
  description = "CS student, CTF player and espresso nerd from Lebanon. Notes on security, C and whatever I'm taking apart this week."

# Links shown in the sidebar under your description
[[params.socialLinks]]
  title = "github"
  url = "https://github.com/kevinbouakar"

[[params.socialLinks]]
  title = "linkedin"
  url = "https://linkedin.com/in/kevinbouakar"

[[params.socialLinks]]
  title = "cv"
  url = "kevinbouakar-cv.pdf"

# Only tags, so Hugo stops building an empty /categories/ page
[taxonomies]
  tag = "tags"

# Lets Obsidian's ==highlight== syntax work on the site
[markup.goldmark.extensions.extras.mark]
  enable = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
    maxAge = -1

[[menu.main]]
  name = "blog"
  pageRef = "/posts"
  weight = 1

[[menu.main]]
  name = "projects"
  pageRef = "/projects"
  weight = 2

[[menu.main]]
  name = "now"
  pageRef = "/now"
  weight = 3

[[menu.main]]
  name = "contact"
  pageRef = "/contact"
  weight = 4

[params]
  lastfmUser = "keviee"