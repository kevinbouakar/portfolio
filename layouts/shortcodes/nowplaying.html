<div class="np">
  <div class="np-info">
    <div><span class="np-label">Track:</span> <a class="np-track"></a></div>
    <div><span class="np-label">Artist:</span> <a class="np-artist"></a></div>
    <div><span class="np-label">Album:</span> <span class="np-album">loading…</span></div>
  </div>
  <img class="np-cover" alt="" hidden>
</div>
<script>
(async function () {
  const box = document.currentScript.previousElementSibling;
  const $ = (s) => box.querySelector(s);
  const q = encodeURIComponent;
  const url = "https://ws.audioscrobbler.com/2.0/?format=json&limit=1"
    + "&method=user.getrecenttracks"
    + "&user=" + q("{{ site.Params.lastfmUser }}")
    + "&api_key={{ site.Params.lastfmKey }}";
  try {
    const data = await (await fetch(url)).json();
    const t = data.recenttracks.track[0];
    const artist = t.artist["#text"];
    const album = t.album["#text"];

    $(".np-track").textContent = t.name;
    $(".np-track").href = t.url;
    $(".np-artist").textContent = artist;
    $(".np-artist").href = "https://www.last.fm/music/" + q(artist);
    $(".np-album").textContent = album || "—";

    const cover = (t.image || []).map((i) => i["#text"]).filter(Boolean).pop();
    if (cover) {
      $(".np-cover").src = cover;
      $(".np-cover").alt = "Album cover of " + (album || t.name);
      $(".np-cover").hidden = false;
    }
  } catch (e) {
    $(".np-album").textContent = "couldn't reach last.fm";
  }
})();
</script>
